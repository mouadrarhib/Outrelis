[project]
name = "outrelis-backend"
version = "0.1.0"
description = "Outrelis FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "app.main:app"
